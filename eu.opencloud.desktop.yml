app-id: eu.opencloud.desktop

runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk

base: io.qt.qtwebengine.BaseApp
base-version: '6.11'

command: opencloud

finish-args:
  - --device=dri
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --share=ipc
  - --filesystem=host:rw
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --env=TMPDIR=/var/tmp

cleanup:
  - /lib/*.a
  - /lib/*.la
  - /lib/x86_64-linux-gnu/pkgconfig
  - /share/doc
  - /share/icons/hicolor/1024x1024
cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  - shared-modules/libsecret/libsecret.json

  - name: qtkeychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TRANSLATIONS=NO
      - -DBUILD_WITH_QT6=1
    cleanup:
      - /include
      - /mkspecs
      - /lib/cmake
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain/
        tag: 0.17.0
        commit: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09

  - name: libre-graph-api
    buildsystem: cmake-ninja
    subdir: client
    sources:
      - type: git
        url: https://github.com/opencloud-eu/libre-graph-api-cpp-qt-client.git
        tag: v1.0.7
        commit: 72b89ddd9a5dab2a837d1ab078d6088fa0727695

  - name: KDSingleApplication
    buildsystem: cmake-ninja
    config-opts:
      - -DKDSingleApplication_QT6=true
    sources:
      - type: git
        url: https://github.com/KDAB/KDSingleApplication
        tag: v1.2.1
        commit: b63420aebb78df20e37310bb090f075990a5a4f6

  - name: opencloud-desktop
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/opencloud-eu/desktop.git
        commit: 20cd9b4e1fe5b8f4c9f1362e23533a8399aa42d1
